[project]
name = "testing-template"
version = "0.1.0"
description = "Generic Python test-harness template (uv + dev container + Playwright)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Runtime dependencies of the harness itself (helpers under src/harness),
    # *not* the test tooling — that lives in the dev dependency group below.
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project root on sys.path so `tests.*` (page objects, helpers) is importable.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
]
markers = [
    "e2e: browser test driven by Playwright (needs `uv run playwright install`)",
    "slow: test that takes more than a few seconds",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
