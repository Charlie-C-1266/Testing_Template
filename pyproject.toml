[project]
name = "testing-template"
version = "0.1.0"
description = "Generic Python test-harness template (uv + dev container + Playwright)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Runtime dependencies of the harness itself (helpers under src/harness),
    # *not* the test tooling — that lives in the dev dependency group below.
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    # The `base-url` extra provides the `--base-url` option tests/e2e/conftest.py
    # reads; pytest-playwright stopped bundling it in 0.10.
    "pytest-playwright[base-url]>=0.10",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project root on sys.path so `tests.*` (page objects, helpers) is importable.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
]
# Fail a hung test instead of letting CI sit until the job timeout.
timeout = 300
markers = [
    "e2e: browser test driven by Playwright (needs `uv run playwright install`)",
    "slow: test that takes more than a few seconds",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
