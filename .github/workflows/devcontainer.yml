# Build the dev container and run the full check inside it, so a broken
# Dockerfile or post-create script is caught before someone opens the repo.
name: Dev container

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build container and run checks
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make check
