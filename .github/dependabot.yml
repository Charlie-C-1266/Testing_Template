# Weekly, grouped update PRs so the template doesn't quietly rot.
# Note: the uv binary pinned via `COPY --from=ghcr.io/astral-sh/uv:<tag>` in
# .devcontainer/Dockerfile may need bumping by hand.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
